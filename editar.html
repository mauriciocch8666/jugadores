<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Editar jugador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand" href="/">
            Football Manager
        </a>

        <a class="btn btn-light" href="/jugadores">
            Jugadores
        </a>

    </div>
</nav>

<div class="container mt-5">
    <div class="card">

        <div class="card-header bg-warning">
            <h3>Editar jugador</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre"
                           class="form-control"
                           value="{{ jugador.nombre }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Edad</label>
                    <input type="number" name="edad"
                           class="form-control"
                           value="{{ jugador.edad }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nacionalidad</label>
                    <input type="text" name="nacionalidad"
                           class="form-control"
                           value="{{ jugador.nacionalidad }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Posición</label>
                    <input type="text" name="posicion"
                           class="form-control"
                           value="{{ jugador.posicion }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Número de camiseta</label>
                    <input type="number" name="numero"
                           class="form-control"
                           value="{{ jugador.numero }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Equipo</label>
                    <input type="text" name="equipo"
                           class="form-control"
                           value="{{ jugador.equipo }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Valor</label>
                    <input type="text" name="valor"
                           class="form-control"
                           value="{{ jugador.valor }}" required>
                </div>

                <button type="submit" class="btn btn-success">
                    Guardar cambios
                </button>

                <a href="/jugadores" class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>
    </div>
</div>

</body>
</html>
